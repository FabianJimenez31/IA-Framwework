name: CI Quality Gate

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-timeout

    - name: Run File Size Enforcement Check
      run: |
        echo "Running quality checks on file sizes..."
        chmod +x .claude/hooks/check-file-size.sh
        for file in $(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true); do
          if [ -f "$file" ]; then
            jq -n --arg path "$file" '{"tool_input":{"file_path":$path}}' | bash .claude/hooks/check-file-size.sh
          fi
        done

    # Only meaningful on pull requests, where there is a source branch to
    # validate. On a push to main the merge commit has already landed, so the
    # protected-branch rule reports "direct commits to main are forbidden" and
    # the step can never pass by construction.
    - name: Run Commit Convention Compliance
      if: github.event_name == 'pull_request'
      run: |
        chmod +x .claude/hooks/pre-commit.sh
        bash .claude/hooks/pre-commit.sh

    - name: Run Test Suite with Coverage
      run: |
        if [ -f "pytest.ini" ] || [ -d "tests" ]; then
          set +e
          pytest --cov=src --cov-report=xml
          status=$?
          set -e
          # Exit code 5 is "no tests were collected". A freshly installed
          # boilerplate has none, and that must not fail the quality gate —
          # otherwise every new project starts with a red pipeline.
          if [ "$status" -eq 5 ]; then
            echo "::notice::No tests collected yet; emitting an empty coverage report."
            status=0
          fi
          if [ ! -f coverage.xml ]; then
            echo '<?xml version="1.0" ?><coverage version="1.0"></coverage>' > coverage.xml
          fi
          exit $status
        else
          echo "No tests found. Generating dummy coverage.xml..."
          echo '<?xml version="1.0" ?><coverage version="1.0"></coverage>' > coverage.xml
        fi

    # The runner has no Engram store and cannot reach the daemon, which binds to
    # 127.0.0.1. The outcome is emitted as an artifact and folded into memory
    # locally with 'make mem-ingest'.
    - name: Emit Memory Outcome Artifact
      if: always()
      run: |
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        SLUG="${BRANCH##*/}"
        mkdir -p temp
        jq -n \
          --arg slug    "$SLUG" \
          --arg branch  "$BRANCH" \
          --arg commit  "${GITHUB_SHA}" \
          --arg status  "${{ job.status }}" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg detail  "CI quality gate on ${GITHUB_WORKFLOW}" \
          '{slug:$slug, branch:$branch, commit:$commit, status:$status, run_url:$run_url, detail:$detail}' \
          > temp/ci-outcome.json
        cat temp/ci-outcome.json

    - name: Upload Memory Outcome Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-outcome
        path: temp/ci-outcome.json
        if-no-files-found: warn

    - name: Check SonarQube Secrets Presence
      id: sonar-secrets
      run: |
        if [ -z "${{ secrets.SONAR_HOST_URL }}" ] || [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
          echo "available=false" >> $GITHUB_OUTPUT
          echo "::warning::SonarQube credentials missing. Skipping Sonar Quality Gate."
        else
          echo "available=true" >> $GITHUB_OUTPUT
        fi

    # Run SonarQube Scan if credentials are set up
    - name: SonarQube Scan
      if: steps.sonar-secrets.outputs.available == 'true'
      uses: SonarSource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Fail the build if the Quality Gate is failing (red status)
    - name: SonarQube Quality Gate Check
      if: steps.sonar-secrets.outputs.available == 'true'
      uses: SonarSource/sonarqube-quality-gate-action@v1
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
