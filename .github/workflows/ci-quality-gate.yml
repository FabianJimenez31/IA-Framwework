name: CI Quality Gate

# Lane-based pipeline: each change validates only what it touches.
# scripts/harness/ci_lanes.py classifies the changed files into the lanes
# declared in scripts/harness/lanes.json, and every job below runs only when its
# lane is active. A change to this workflow activates every lane.
#
#   changes + conventions   → always
#   backend-tests           → backend lane   (pytest + coverage.xml)
#   frontend-tests          → frontend lane  (build + tests + lcov)
#   sonar                   → backend or frontend, with whatever coverage exists
#   outcome                 → always, memory artifact with the overall result

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the frontend lane path in scripts/harness/lanes.json.
  FRONTEND_DIR: frontend

jobs:
  changes:
    name: Lanes touched by the change
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.lanes.outputs.backend }}
      frontend: ${{ steps.lanes.outputs.frontend }}
      any: ${{ steps.lanes.outputs.any }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Pull request: diff against the base. Push: diff against the previous tip.
    # If neither is usable the script activates every lane.
    - name: Compute lanes
      id: lanes
      run: >-
        python3 scripts/harness/ci_lanes.py --mode ci
        --base "${{ github.event.pull_request.base.sha || github.event.before }}"
        --head HEAD

  conventions:
    name: Conventions (file size, branch, specs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run File Size Enforcement Check
      run: |
        echo "Running quality checks on file sizes..."
        chmod +x .claude/hooks/check-file-size.sh
        for file in $(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true); do
          if [ -f "$file" ]; then
            jq -n --arg path "$file" '{"tool_input":{"file_path":$path}}' | bash .claude/hooks/check-file-size.sh
          fi
        done

    # Only meaningful on pull requests, where there is a source branch to
    # validate. On a push to main the merge commit has already landed, so the
    # protected-branch rule reports "direct commits to main are forbidden" and
    # the step can never pass by construction.
    - name: Run Commit Convention Compliance
      if: github.event_name == 'pull_request'
      run: |
        chmod +x .claude/hooks/pre-commit.sh
        bash .claude/hooks/pre-commit.sh

  backend-tests:
    name: Backend · Tests + Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-timeout

    - name: Run Test Suite with Coverage
      run: |
        if [ -f "pytest.ini" ] || [ -d "tests" ]; then
          set +e
          pytest --cov=src --cov-report=xml
          status=$?
          set -e
          # Exit code 5 is "no tests were collected". A freshly installed
          # boilerplate has none, and that must not fail the quality gate —
          # otherwise every new project starts with a red pipeline.
          if [ "$status" -eq 5 ]; then
            echo "::notice::No tests collected yet; emitting an empty coverage report."
            status=0
          fi
          if [ ! -f coverage.xml ]; then
            echo '<?xml version="1.0" ?><coverage version="1.0"></coverage>' > coverage.xml
          fi
          exit $status
        else
          echo "No tests found. Generating dummy coverage.xml..."
          echo '<?xml version="1.0" ?><coverage version="1.0"></coverage>' > coverage.xml
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-backend
        path: coverage.xml
        if-no-files-found: ignore

  frontend-tests:
    name: Frontend · Build + Tests + Coverage
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    # The lane can be active before the project has a frontend (for example when
    # this workflow itself changes), so every step is skipped without a package.
    - name: Detect frontend package
      id: pkg
      run: |
        if [ -f "$FRONTEND_DIR/package.json" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No $FRONTEND_DIR/package.json; frontend lane has nothing to run."
        fi

    - uses: actions/setup-node@v4
      if: steps.pkg.outputs.present == 'true'
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      if: steps.pkg.outputs.present == 'true'
      working-directory: ${{ env.FRONTEND_DIR }}
      run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Build
      if: steps.pkg.outputs.present == 'true'
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm run build --if-present

    # One run validates the tests and produces the lcov report Sonar reads.
    # Falls back to the plain test script when the project has no coverage one.
    - name: Tests + coverage
      if: steps.pkg.outputs.present == 'true'
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        if npm run | grep -q '^  test:coverage$'; then
          npm run test:coverage
        else
          npm test --if-present
        fi

    # Sonar resolves lcov paths from the repository root.
    - name: Rewrite lcov paths
      if: always() && steps.pkg.outputs.present == 'true'
      run: |
        if [ -f "$FRONTEND_DIR/coverage/lcov.info" ]; then
          sed -i "s|^SF:|SF:$FRONTEND_DIR/|" "$FRONTEND_DIR/coverage/lcov.info"
        fi

    - uses: actions/upload-artifact@v4
      if: always() && steps.pkg.outputs.present == 'true'
      with:
        name: coverage-frontend
        path: ${{ env.FRONTEND_DIR }}/coverage/lcov.info
        if-no-files-found: ignore

  sonar:
    name: SonarQube Quality Gate
    needs: [changes, backend-tests, frontend-tests]
    # Runs when a code lane is active and none of its tests failed; a skipped
    # lane does not block.
    if: >-
      !cancelled()
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
      && needs.backend-tests.result != 'failure' && needs.frontend-tests.result != 'failure'
      && needs.backend-tests.result != 'cancelled' && needs.frontend-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check SonarQube Secrets Presence
      id: sonar-secrets
      run: |
        if [ -z "${{ secrets.SONAR_HOST_URL }}" ] || [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
          echo "available=false" >> $GITHUB_OUTPUT
          echo "::warning::SonarQube credentials missing. Skipping Sonar Quality Gate."
        else
          echo "available=true" >> $GITHUB_OUTPUT
        fi

    - uses: actions/checkout@v4
      if: steps.sonar-secrets.outputs.available == 'true'
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      if: steps.sonar-secrets.outputs.available == 'true'
      with:
        pattern: coverage-*
        path: coverage-artifacts

    # Each artifact lands in its own folder; Sonar expects the original paths.
    - name: Place coverage reports
      if: steps.sonar-secrets.outputs.available == 'true'
      run: |
        if [ -f coverage-artifacts/coverage-backend/coverage.xml ]; then
          cp coverage-artifacts/coverage-backend/coverage.xml coverage.xml
        else
          echo '<?xml version="1.0" ?><coverage version="1.0"></coverage>' > coverage.xml
        fi
        if [ -f coverage-artifacts/coverage-frontend/lcov.info ]; then
          mkdir -p "$FRONTEND_DIR/coverage"
          cp coverage-artifacts/coverage-frontend/lcov.info "$FRONTEND_DIR/coverage/lcov.info"
        fi

    - name: SonarQube Scan
      if: steps.sonar-secrets.outputs.available == 'true'
      uses: SonarSource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Fail the build if the Quality Gate is failing (red status)
    - name: SonarQube Quality Gate Check
      if: steps.sonar-secrets.outputs.available == 'true'
      uses: SonarSource/sonarqube-quality-gate-action@v1
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # The runner has no Engram store and cannot reach the daemon, which binds to
  # 127.0.0.1. The outcome is emitted as an artifact and folded into memory
  # locally with 'make mem-ingest'.
  outcome:
    name: Memory outcome artifact
    needs: [changes, conventions, backend-tests, frontend-tests, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - name: Emit Memory Outcome Artifact
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        STATUS=success
        case " $RESULTS " in
          *" failure "*)   STATUS=failure ;;
          *" cancelled "*) STATUS=cancelled ;;
        esac
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        SLUG="${BRANCH##*/}"
        mkdir -p temp
        jq -n \
          --arg slug    "$SLUG" \
          --arg branch  "$BRANCH" \
          --arg commit  "${GITHUB_SHA}" \
          --arg status  "$STATUS" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg detail  "CI quality gate on ${GITHUB_WORKFLOW}" \
          '{slug:$slug, branch:$branch, commit:$commit, status:$status, run_url:$run_url, detail:$detail}' \
          > temp/ci-outcome.json
        cat temp/ci-outcome.json

    - name: Upload Memory Outcome Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ci-outcome
        path: temp/ci-outcome.json
        if-no-files-found: warn
